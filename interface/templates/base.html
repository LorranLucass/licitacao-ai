<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LicitaPDF{% endblock %}</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="{{ url_for('static', filename='img/favicon.svg') }}"
    >

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS principal -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <!-- =====================================================
         APLICAR TEMA ANTES DA PÁGINA APARECER
         Evita o "piscar" da tela.
    ====================================================== -->

    <script>
        (function () {

            const temaSalvo =
                localStorage.getItem("licitapdf-tema");

            if (temaSalvo === "dark") {

                document.documentElement.setAttribute(
                    "data-theme",
                    "dark"
                );

            } else {

                document.documentElement.setAttribute(
                    "data-theme",
                    "light"
                );

            }

        })();
    </script>

    {% block head %}{% endblock %}

</head>


<body>


<!-- =========================================================
     TOPO
========================================================= -->

<header class="lp-topbar">

    <div class="lp-topbar__inner">


        <!-- =================================================
             LOGO
        ================================================== -->

        <a
            href="/"
            class="lp-brand"
            aria-label="LicitaPDF - página inicial"
        >

            <svg
                class="lp-brand__mark"
                viewBox="0 0 76 88"
                width="30"
                height="35"
                aria-hidden="true"
            >

                <rect
                    width="76"
                    height="88"
                    rx="14"
                    fill="#101826"
                />


                <g transform="translate(4,4)">

                    <path
                        fill="#F4F5F1"
                        d="M6 2 H38 L54 18 V70 C54 73.3 51.3 76 48 76 H6 C2.7 76 0 73.3 0 70 V8 C0 4.7 2.7 2 6 2 Z"
                    />


                    <path
                        fill="#101826"
                        opacity="0.18"
                        d="M38 2 L54 18 H42 C39.8 18 38 16.2 38 14 V2 Z"
                    />


                    <line
                        x1="10"
                        y1="30"
                        x2="36"
                        y2="30"
                        stroke="#101826"
                        stroke-width="3"
                        stroke-linecap="round"
                    />


                    <line
                        x1="10"
                        y1="40"
                        x2="36"
                        y2="40"
                        stroke="#101826"
                        stroke-width="3"
                        stroke-linecap="round"
                    />


                    <line
                        x1="10"
                        y1="50"
                        x2="28"
                        y2="50"
                        stroke="#101826"
                        stroke-width="3"
                        stroke-linecap="round"
                    />


                    <g transform="translate(38,44)">

                        <circle
                            r="19"
                            fill="#101826"
                            stroke="#A02334"
                            stroke-width="2.5"
                            stroke-dasharray="3 3.5"
                        />


                        <path
                            d="M-8 0 L-2 6 L10 -7"
                            fill="none"
                            stroke="#A02334"
                            stroke-width="3.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </g>

                </g>

            </svg>


            <span class="lp-brand__text">

                <span class="lp-brand__word">
                    Licita<em>PDF</em>
                </span>

                <span class="lp-brand__tag">
                    Análise automatizada de editais
                </span>

            </span>

        </a>


        <!-- =================================================
             MENU / BOTÃO DE TEMA
        ================================================== -->

        <nav class="lp-topbar__nav">


            <!-- BADGE -->

            <span class="lp-topbar__badge">
                Uso interno
            </span>


            <!-- =================================================
                 BOTÃO MODO CLARO / ESCURO
            ================================================== -->

            <button
                type="button"
                class="lp-theme-toggle"
                id="theme-toggle"
                aria-label="Ativar modo escuro"
                title="Ativar modo escuro"
            >

                <span
                    id="theme-icon"
                    aria-hidden="true"
                >
                    🌙
                </span>

                <span id="theme-text">
                    Modo escuro
                </span>

            </button>


        </nav>


    </div>

</header>


<!-- =========================================================
     CONTEÚDO
========================================================= -->

<main class="lp-page">

    {% block content %}{% endblock %}

</main>


<!-- =========================================================
     RODAPÉ
========================================================= -->

<footer class="lp-footer">

    <div class="lp-footer__inner">

        <span>
            LicitaPDF &mdash;
            sistema interno de leitura e triagem de editais
        </span>


        <span class="lp-footer__meta">

            Motor de extração: IA
            &middot;
            Base de referência: Tabela DELTA

        </span>

    </div>

</footer>


<!-- =========================================================
     SCRIPTS DAS PÁGINAS
========================================================= -->

{% block scripts %}{% endblock %}


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- =========================================================
     SISTEMA DE TEMA
========================================================= -->

<script>

(function () {


    const botao =
        document.getElementById("theme-toggle");

    const icone =
        document.getElementById("theme-icon");

    const texto =
        document.getElementById("theme-text");


    /*
     * Segurança:
     * se o botão não existir, não executa o restante.
     */

    if (!botao || !icone || !texto) {
        return;
    }


    /*
     * Atualiza aparência e texto do botão.
     */

    function atualizarBotao(tema) {


        if (tema === "dark") {


            icone.textContent = "☀️";

            texto.textContent = "Modo claro";


            botao.setAttribute(
                "aria-label",
                "Ativar modo claro"
            );


            botao.setAttribute(
                "title",
                "Ativar modo claro"
            );


        } else {


            icone.textContent = "🌙";

            texto.textContent = "Modo escuro";


            botao.setAttribute(
                "aria-label",
                "Ativar modo escuro"
            );


            botao.setAttribute(
                "title",
                "Ativar modo escuro"
            );

        }

    }


    /*
     * Descobre o tema atual.
     */

    let temaAtual =
        document.documentElement.getAttribute(
            "data-theme"
        ) || "light";


    /*
     * Atualiza o botão quando a página carrega.
     */

    atualizarBotao(temaAtual);


    /*
     * Clique no botão.
     */

    botao.addEventListener(
        "click",
        function () {


            /*
             * Alterna o tema.
             */

            temaAtual =
                temaAtual === "dark"
                    ? "light"
                    : "dark";


            /*
             * Aplica o tema no HTML.
             */

            document.documentElement.setAttribute(
                "data-theme",
                temaAtual
            );


            /*
             * Salva a escolha do usuário.
             */

            localStorage.setItem(
                "licitapdf-tema",
                temaAtual
            );


            /*
             * Atualiza o botão.
             */

            atualizarBotao(temaAtual);

        }
    );


})();

</script>


</body>

</html>
