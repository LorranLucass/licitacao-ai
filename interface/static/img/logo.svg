<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96">
  <defs>
    <style>
      .lp-ink { fill: #101826; }
      .lp-paper { fill: #F4F5F1; }
      .lp-carmine { stroke: #A02334; }
      .lp-carmine-fill { fill: #A02334; }
      .lp-line { fill: none; stroke: #101826; stroke-width: 3; stroke-linecap: round; }
      .lp-word { font-family: 'IBM Plex Sans', Arial, sans-serif; font-weight: 700; }
      .lp-tag { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-weight: 500; letter-spacing: 2.5px; }
    </style>
  </defs>

  <!-- MARCA: documento com dobra + selo carimbado -->
  <g transform="translate(8,8)">
    <path class="lp-ink" d="M6 2 H50 L68 20 V78 C68 81.3 65.3 84 62 84 H6 C2.7 84 0 81.3 0 78 V8 C0 4.7 2.7 2 6 2 Z"/>
    <path class="lp-paper" d="M50 2 L68 20 H54 C51.8 20 50 18.2 50 16 V2 Z" opacity="0.55"/>

    <line class="lp-line" x1="14" y1="34" x2="46" y2="34" stroke="#F4F5F1"/>
    <line class="lp-line" x1="14" y1="46" x2="46" y2="46" stroke="#F4F5F1"/>
    <line class="lp-line" x1="14" y1="58" x2="36" y2="58" stroke="#F4F5F1"/>

    <g transform="translate(46,50)">
      <circle r="24" fill="#F4F5F1" stroke="#A02334" stroke-width="2.5" stroke-dasharray="3.5 4"/>
      <path d="M-10 0 L-3 8 L12 -9" fill="none" stroke="#A02334" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(96,0)">
    <text x="0" y="52" class="lp-word lp-ink" font-size="34">Licita<tspan fill="#A02334">PDF</tspan></text>
    <text x="1" y="74" class="lp-tag" font-size="11" fill="#3B4657">ANÁLISE AUTOMATIZADA DE EDITAIS</text>
  </g>
</svg>
